<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page non disponible - Typhon</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101418; color: #e0e5ea; font-family: 'Google Sans', system-ui, sans-serif;
    padding: 32px;
  }
  .wrap { max-width: 560px; text-align: center; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a99bf0; margin-bottom: 24px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: #e0e5ea;
    background: rgba(76,63,145,0.35); border: 1px solid #4c3f91; border-radius: 999px;
    padding: 4px 12px; margin-bottom: 20px;
  }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 14px; font-weight: 600; }
  p { font-size: 15px; line-height: 1.6; color: #bec7d0; margin: 0 0 10px; }
  a.back { display: inline-block; margin-top: 24px; font-size: 14px; color: #a99bf0; text-decoration: none; border-bottom: 1px solid transparent; }
  a.back:hover { border-bottom-color: #a99bf0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Typhon</div>
    <div class="badge">Bientôt</div>
    <h1>Cette page n'est pas encore disponible</h1>
    <p>Vous cherchez le diagnostic de risque climatique par bâtiment ?
    Retrouvez-le sur la page d'accueil.</p>
    <a class="back" href="/">&larr; Retour à l'accueil</a>
  </div>
</body>
</html>
